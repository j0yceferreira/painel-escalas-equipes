<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Escalas — Acesso</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172b4d;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,440px);background:white;border-radius:18px;padding:32px;box-shadow:0 12px 45px #203a601a}h1{font-size:25px;margin:0 0 8px}p{color:#52647e;line-height:1.5}.field{margin:20px 0}label{display:block;font-weight:600;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid #bac8d8;border-radius:9px;font:inherit}button{width:100%;border:0;border-radius:9px;padding:13px;background:#205caa;color:white;font-weight:700;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.notice{font-size:14px;min-height:22px;margin-top:15px}.error{color:#b3261e}.success{color:#166534}.hidden{display:none}.pill{display:inline-block;padding:5px 9px;background:#e8f1fc;border-radius:999px;font-size:13px;color:#205caa}#profile{margin-top:16px;padding:14px;background:#f3f6fb;border-radius:9px}#logout{margin-top:15px;background:#485b76}
</style>
</head>
<body>
<main class="panel">
<section id="loginSection">
<span class="pill">Acesso das equipes</span><h1>Painel de Escalas</h1><p>Entre com o usuário da sua equipe e a senha provisória recebida da administração.</p>
<form id="loginForm">
<div class="field"><label for="username">Usuário</label><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="Ex.: equipecamila"></div>
<div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div>
<button id="submit" type="submit">Entrar</button>
</form><p id="status" class="notice" role="status" aria-live="polite"></p>
</section>
<section id="loggedSection" class="hidden"><span class="pill">Autenticado</span><h1>Bem-vindo(a)!</h1><p>Seu login foi validado no Firebase.</p><div id="profile"></div><p>Esta versão testa somente o acesso. O calendário e a edição das escalas serão conectados depois.</p><button id="logout">Sair</button></section>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyD_VpCbVybicetbCxWy48yejzyFFyfotGI',authDomain:'painel-escalas-equipes.firebaseapp.com',projectId:'painel-escalas-equipes',storageBucket:'painel-escalas-equipes.firebasestorage.app',messagingSenderId:'532049991705',appId:'1:532049991705:web:45af25732cd8bdbde9b288'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),loginSection=$('loginSection'),loggedSection=$('loggedSection'),status=$('status'),submit=$('submit');
const allowed=new Set(['equipecamila','equipedjalma','equipemariana','equipeozenil','equipeeric','equipejaque','equipejorney','equipeisabella','equipekercia','equipethiago','joyce','mauro','coordenacao']);
function showLogin(){loginSection.classList.remove('hidden');loggedSection.classList.add('hidden')}
function showProfile(a){loginSection.classList.add('hidden');loggedSection.classList.remove('hidden');$('profile').textContent=`Usuário: ${a.login} | Perfil: ${a.perfil} | Equipe: ${a.equipeId}`}
$('loginForm').addEventListener('submit',async event=>{event.preventDefault();status.textContent='';status.className='notice';submit.disabled=true;try{const login=$('username').value.trim().toLowerCase();if(!allowed.has(login))throw Error('Usuário ou senha inválidos.');const email=`${login}@painel-escalas-equipes.invalid`;await signInWithEmailAndPassword(auth,email,$('password').value);$('password').value='';}catch(e){status.textContent=e.message==='Usuário ou senha inválidos.'?e.message:'Não foi possível entrar. Verifique o usuário e a senha.';status.className='notice error'}finally{submit.disabled=false}});
onAuthStateChanged(auth,async user=>{if(!user){showLogin();return}try{const snap=await getDoc(doc(db,'acessos',user.uid));if(!snap.exists()||snap.data().ativo!==true||!allowed.has(snap.data().login)||user.email!==`${snap.data().login}@painel-escalas-equipes.invalid`){await signOut(auth);status.textContent='Conta sem acesso autorizado.';status.className='notice error';return}showProfile(snap.data())}catch(e){showLogin();status.textContent='Não foi possível verificar a autorização no Firestore.';status.className='notice error'}});
$('logout').addEventListener('click',()=>signOut(auth));
</script>
</body></html>
